<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenezine</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --accent: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
        color: var(--text);
      }

      main {
        width: min(90vw, 680px);
        padding: 3rem;
        text-align: center;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.25rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.6;
        color: rgba(248, 250, 252, 0.88);
      }

      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.4rem 0.8rem;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.15);
        color: #86efac;
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Greenezine</div>
      <h1>New website coming soon</h1>
      <p>We’re building something fresh for Greenezine. Please check back soon.</p>
    </main>
  </body>
</html>
